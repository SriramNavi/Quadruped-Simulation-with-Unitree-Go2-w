go2w_cmd_vel_to_wheels:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    wheel_command_topic: /go2w_wheel_velocity_controller/commands
    emergency_stop_topic: /go2w/emergency_stop

    # Derived from the local Go2-W URDF wheel meshes and joint chains.
    wheel_radius_m: 0.086
    track_width_m: 0.3802

    max_linear_velocity_mps: 1.5
    max_reverse_velocity_mps: 1.0
    max_angular_velocity_radps: 1.5
    max_wheel_angular_velocity_radps: 10.0

    max_linear_acceleration_mps2: 0.8
    max_linear_deceleration_mps2: 1.2
    max_angular_acceleration_radps2: 1.0
    max_wheel_acceleration_radps2: 8.0

    minimum_turning_radius_m: 0.75
    max_angular_velocity_at_zero_speed_radps: 1.0
    max_angular_velocity_at_max_speed_radps: 0.35
    allow_pivot_turn: true
    pivot_turn_max_radps: 0.5
    pivot_speed_threshold_mps: 0.10

    command_timeout_sec: 0.5
    control_rate_hz: 50.0
    deadband: 0.01

go2w_keyboard_cmd_vel:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    emergency_stop_topic: /go2w/emergency_stop
    publish_rate_hz: 10.0

    linear_step_mps: 0.10
    angular_step_radps: 0.10
    minimum_linear_step_mps: 0.05
    maximum_linear_step_mps: 0.50
    minimum_angular_step_radps: 0.05
    maximum_angular_step_radps: 0.50
    increment_adjustment: 0.05

    max_linear_velocity_mps: 1.5
    max_reverse_velocity_mps: 1.0
    max_keyboard_angular_velocity_radps: 1.5

    # Used only to display the same safe, saturated target as the drive node.
    wheel_radius_m: 0.086
    track_width_m: 0.3802
    max_wheel_angular_velocity_radps: 10.0
    minimum_turning_radius_m: 0.75
    max_angular_velocity_at_zero_speed_radps: 1.0
    max_angular_velocity_at_max_speed_radps: 0.35
    allow_pivot_turn: true
    pivot_turn_max_radps: 0.5
    pivot_speed_threshold_mps: 0.10
    deadband: 0.01
